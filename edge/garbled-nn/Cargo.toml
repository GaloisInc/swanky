[package]
name = "swanky-garbled-nn"
description = "Garbled neural networks using `fancy-garbling`"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
fancy-analyzer.workspace = true
fancy-circuits.workspace = true
fancy-garbling.workspace = true
fancy-plaintext.workspace = true
fancy-traits.workspace = true
swanky-channel.workspace = true
swanky-error.workspace = true
swanky-field-binary.workspace = true
swanky-ot-iknp.workspace = true
swanky-ot-traits-new.workspace = true
swanky-rng.workspace = true
swanky-twopac.workspace = true
vectoreyes.workspace = true

clap.workspace = true
itertools.workspace = true
ndarray.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "benches"
harness = false
