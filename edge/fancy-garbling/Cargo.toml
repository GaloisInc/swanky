[package]
name = "fancy-garbling"
readme = "README.md"
description = "A library for boolean and arithmetic garbling"
categories = ["cryptography"]
keywords = ["cryptography", "garbled-circuit", "GC"]
autobenches = false
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
rand.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
subtle.workspace = true

fancy-traits.workspace = true
swanky-channel.workspace = true
swanky-cr-hash.workspace = true
swanky-error.workspace = true
swanky-field.workspace = true
swanky-field-binary.workspace = true
vectoreyes.workspace = true

[dev-dependencies]
fancy-circuits.workspace = true
fancy-plaintext.workspace = true
swanky-rng.workspace = true
criterion.workspace = true

[[bench]]
name = "garbling"
harness = false

[[bench]]
name = "circuits"
harness = false
