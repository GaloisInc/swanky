[package]
name = "simple-arith-circuit"
description = "Simple arithmetic circuit library"
categories = ["cryptography"]
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
proptest = ["dep:proptest"]
serde = ["dep:serde"]

[dependencies]
rand.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
proptest = { workspace = true, optional = true }
log.workspace = true
swanky-rng.workspace = true
swanky-field.workspace = true
swanky-field-binary.workspace = true
swanky-field-f61p.workspace = true
swanky-field-ff-primes.workspace = true

[dev-dependencies]
proptest.workspace = true
bincode.workspace = true
tempfile.workspace = true
vectoreyes.workspace = true

[[bench]]
name = "reader_scalability"
harness = false
