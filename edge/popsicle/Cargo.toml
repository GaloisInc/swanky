[package]
name = "popsicle"
readme = "README.md"
description = "A library for private set intersection"
categories = ["cryptography"]
keywords = ["cryptography", "private-set-intersection", "PSI"]
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]

[dependencies]
fancy-circuits.workspace = true
fancy-garbling = { workspace = true, features = ["serde"] }
fancy-traits.workspace = true
swanky-adversary.workspace = true
swanky-block.workspace = true
swanky-channel.workspace = true
swanky-channel-legacy.workspace = true
swanky-cointoss.workspace = true
swanky-cr-hash.workspace = true
swanky-error.workspace = true
swanky-oprf-kkrt.workspace = true
swanky-oprf-kmprt.workspace = true
swanky-oprf-traits.workspace = true
swanky-ot-alsz-kos.workspace = true
swanky-twopac.workspace = true
vectoreyes.workspace = true

aes-gcm.workspace = true
itertools.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2.workspace = true

[dev-dependencies]
swanky-rng.workspace = true

criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "psz"
harness = false

[[bench]]
name = "psty"
harness = false

[[example]]
name = "psty"

[[example]]
name = "psty-payload"

[[example]]
name = "circuit_psi_cardinality"

[[example]]
name = "circuit_psi_payload_sum"
